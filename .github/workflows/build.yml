
name: Build DragonHeart Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: Incluir KernelSU Next
        type: boolean
        default: true
      user_ns:
        description: Incluir User Namespaces para Droidspaces
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 cpio rsync \
            zip unzip curl git wget dialog

      - name: Add User Namespaces
        if: ${{ inputs.user_ns }}
        run: |
          D=arch/arm64/configs/dragonheart_defconfig

          sed -i -E \
            '/^(# )?CONFIG_USER_NS( is not set|=.*)$/d' "$D"

          printf '\nCONFIG_USER_NS=y\n' >> "$D"

      - name: Add KernelSU Next
        if: ${{ inputs.ksu }}
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          D=arch/arm64/configs/dragonheart_defconfig

          sed -i -E \
            '/^(# )?CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS)( is not set|=.*)$/d' "$D"

          printf '\n# KernelSU Next\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\nCONFIG_KSU_KPROBE_HOOKS=y\n' >> "$D"

      - name: Verify kernel configuration
        run: |
          set -e

          D=arch/arm64/configs/dragonheart_defconfig

          echo "=== KernelSU Next / User Namespaces ==="
          grep -E '^(CONFIG_USER_NS|CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_KPROBE_HOOKS)=' "$D" || true

          if [ "${{ inputs.user_ns }}" = "true" ]; then
            grep -qx 'CONFIG_USER_NS=y' "$D"
          fi

          if [ "${{ inputs.ksu }}" = "true" ]; then
            grep -qx 'CONFIG_KSU=y' "$D"
            grep -qx 'CONFIG_KSU_KPROBE_HOOKS=y' "$D"
          fi

      - name: Build kernel
        env:
          CI: "1"
        run: |
          chmod +x kramel.sh
          bash kramel.sh img

      - name: Build AnyKernel3 zip
        env:
          CI: "1"
        run: |
          bash kramel.sh mkzip

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: DragonHeart-cancunf
          path: anykernel3-dragonheart/*.zip
          if-no-files-found: error
          
