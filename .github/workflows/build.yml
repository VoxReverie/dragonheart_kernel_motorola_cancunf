name: Build DragonHeart Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: Incluir KernelSU Next
        type: boolean
        default: true
      user_ns:
        description: Incluir User Namespaces para Droidspaces
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: android12-5.10

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential python3 cpio rsync \
            zip unzip curl git wget dialog

      - name: Add User Namespaces
        if: ${{ inputs.user_ns }}
        run: |
          set -euo pipefail

          D=arch/arm64/configs/dragonheart_defconfig

          sed -i -E \
            '/^(# )?CONFIG_USER_NS( is not set|=.*)$/d' "$D"

          printf '\nCONFIG_USER_NS=y\n' >> "$D"

      - name: Add KernelSU Next
        if: ${{ inputs.ksu }}
        run: |
          set -euo pipefail

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          test -d KernelSU-Next

          git -C KernelSU-Next fetch --force origin legacy
          git -C KernelSU-Next checkout --detach origin/legacy

          echo "=== KernelSU Next revision ==="
          git -C KernelSU-Next log -1 --format='%H %s'

      - name: Patch KernelSU Next SELinux compatibility
        if: ${{ inputs.ksu }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          rules = Path("drivers/kernelsu/selinux/rules.c")
          header = Path("drivers/kernelsu/selinux/sepolicy.h")
          if not rules.is_file() or not header.is_file():
              raise SystemExit("KernelSU Next SELinux source files were not found after setup")

          source = rules.read_text()
          old = "u32 seqno = selinux_state.ss ? ++selinux_state.ss->latest_granting : 1;"
          new = """#ifdef SELINUX_POLICY_INSTEAD_SELINUX_SS
          \tstruct selinux_policy *policy = rcu_dereference_protected(
          \t\tselinux_state.policy,
          \t\tlockdep_is_held(&selinux_state.policy_mutex));
          \tu32 seqno = policy ? ++policy->latest_granting : 1;
          #else
          \tu32 seqno = selinux_state.ss ? ++selinux_state.ss->latest_granting : 1;
          #endif"""
          if old in source:
              if source.count(old) != 1:
                  raise SystemExit("Unexpected number of SELinux sequence-number lines in rules.c")
              rules.write_text(source.replace(old, new, 1))
          elif "u32 seqno = policy ? ++policy->latest_granting : 1;" not in source:
              raise SystemExit("Could not locate expected reset_avc_cache() line in rules.c")

          source = header.read_text()
          declarations = """struct selinux_policy;
          struct selinux_policy *ksu_dup_sepolicy(struct selinux_policy *old_pol);
          void ksu_destroy_sepolicy(struct selinux_policy *pol);
          """
          if "ksu_dup_sepolicy(struct selinux_policy *old_pol);" not in source:
              include = '#include "ss/policydb.h"'
              if source.count(include) != 1:
                  raise SystemExit("Could not locate expected include in sepolicy.h")
              source = source.replace(include, include + "\\n\\n" + declarations, 1)
              header.write_text(source)

          print("Applied KernelSU Next SELinux compatibility patch.")
          PY

          D=arch/arm64/configs/dragonheart_defconfig

          sed -i -E \
            '/^(# )?CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS)( is not set|=.*)$/d' "$D"

          printf '\n# KernelSU Next\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\nCONFIG_KSU_KPROBE_HOOKS=y\n' >> "$D"

      - name: Verify defconfig
        run: |
          set -euo pipefail

          D=arch/arm64/configs/dragonheart_defconfig

          echo "=== Relevant kernel options ==="
          grep -E '^(CONFIG_USER_NS|CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_KPROBE_HOOKS)=' "$D" || true

          if [ "${{ inputs.user_ns }}" = "true" ]; then
            grep -qx 'CONFIG_USER_NS=y' "$D"
          fi

          if [ "${{ inputs.ksu }}" = "true" ]; then
            grep -qx 'CONFIG_KSU=y' "$D"
            grep -qx 'CONFIG_KSU_KPROBE_HOOKS=y' "$D"
          fi

      - name: Build kernel
        env:
          CI: "1"
        run: |
          set -euo pipefail
          chmod +x kramel.sh
          bash kramel.sh img

      - name: Verify final kernel config
        run: |
          set -euo pipefail

          C=out/.config
          test -f "$C"

          echo "=== Final kernel configuration ==="
          grep -E '^(CONFIG_USER_NS|CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_KPROBE_HOOKS)=' "$C" || true

          if [ "${{ inputs.user_ns }}" = "true" ]; then
            grep -qx 'CONFIG_USER_NS=y' "$C"
          fi

          if [ "${{ inputs.ksu }}" = "true" ]; then
            grep -qx 'CONFIG_KSU=y' "$C"
          fi

      - name: Build AnyKernel3 zip
        env:
          CI: "1"
        run: |
          set -euo pipefail
          bash kramel.sh mkzip

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: DragonHeart-cancunf
          path: anykernel3-dragonheart/*.zip
          if-no-files-found: error
