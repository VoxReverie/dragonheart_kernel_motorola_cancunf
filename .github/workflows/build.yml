name: Build DragonHeart Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: Incluir KernelSU Next
        type: boolean
        default: true
      ksu_branch:
        description: Rama de KernelSU Next (vacio = rama por defecto del repo)
        type: string
        default: ""
      user_ns:
        description: Incluir User Namespaces para Droidspaces
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 cpio rsync zip unzip curl git wget dialog

      - name: Add User Namespaces
        if: ${{ inputs.user_ns }}
        run: |
          D=arch/arm64/configs/dragonheart_defconfig
          sed -i -E '/^(# )?CONFIG_USER_NS( is not set|=.*)$/d' "$D"
          printf '\nCONFIG_USER_NS=y\n' >> "$D"

      - name: Add KernelSU Next
        if: ${{ inputs.ksu }}
        env:
          KSU_BRANCH: ${{ inputs.ksu_branch }}
        run: |
          URL=https://github.com/KernelSU-Next/KernelSU-Next
          BR="$KSU_BRANCH"
          if [ -z "$BR" ]; then
            BR=$(git ls-remote --symref "$URL" HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2}')
          fi
          echo "Rama de KernelSU Next: $BR"
          if ! git ls-remote --exit-code --heads "$URL" "$BR" > /dev/null; then
            echo "La rama $BR no existe. Ramas disponibles:"
            git ls-remote --heads "$URL" | awk '{print $2}'
            exit 1
          fi
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/$BR/kernel/setup.sh" | bash -s "$BR"
          D=arch/arm64/configs/dragonheart_defconfig
          sed -i -E '/^(# )?CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)( is not set|=.*)$/d' "$D"
          printf '\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_HAVE_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\n' >> "$D"

      - name: Build kernel
        env:
          CI: "1"
        run: |
          chmod +x kramel.sh
          bash kramel.sh img

      - name: Build AnyKernel3 zip
        env:
          CI: "1"
        run: |
          bash kramel.sh mkzip

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: DragonHeart-cancunf
          path: anykernel3-dragonheart/*.zip 
